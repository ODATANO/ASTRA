name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # A tag publishes nothing CI would have failed, and never a version that
  # disagrees with package.json.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG'"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test

  build-and-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF#refs/tags/}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/astra:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/astra:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the image for the release
        run: |
          IMG=ghcr.io/${{ steps.version.outputs.owner }}/astra:${{ steps.version.outputs.version }}
          docker pull "$IMG"
          docker save "$IMG" | gzip > astra-${{ steps.version.outputs.version }}.tar.gz

      - uses: softprops/action-gh-release@v3
        with:
          files: astra-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
